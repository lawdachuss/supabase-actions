# This override adds a Redis 7 in-memory data store to the self-hosted stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.redis.yml up -d
#
# Or include it in COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.logs.yml:docker-compose.redis.yml
#
# Redis is available on the Docker network as 'redis:6379' to all services.
# To connect from edge functions or your app:
#   redis://default:${REDIS_PASSWORD}@redis:6379

services:

  redis:
    container_name: supabase-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - ./volumes/redis/data:/data:z
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # ── Durability ─────────────────────────────────────────────────────────
    # AOF (appendonly) is the primary safety net: every write is appended, so a
    # hard runner kill or a container restart loses at most ~1s of writes
    # (everysec) instead of everything back to the last RDB point.
    #   --aof-use-rdb-preamble : compacts each rewrite (smaller, faster load)
    #   --aof-load-truncated   : a half-written tail must never stop Redis from
    #                            booting after a hard kill
    # RDB stays enabled as a compact secondary + fallback, and now fires as soon
    # as there's a SINGLE change within 60s (was: 100 changes / 60s, and 5 min).
    # Both formats are captured in the state archive by utils/snapshot-state.sh.
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}",
        "--maxmemory", "${REDIS_MAXMEMORY:-128mb}",
        "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}",
        "--appendonly", "${REDIS_APPENDONLY:-yes}",
        "--appendfsync", "${REDIS_APPENDFSYNC:-everysec}",
        "--aof-use-rdb-preamble", "yes",
        "--aof-load-truncated", "yes",
        "--auto-aof-rewrite-percentage", "${REDIS_AOF_REWRITE_PERCENT:-100}",
        "--auto-aof-rewrite-min-size", "${REDIS_AOF_REWRITE_MIN_SIZE:-64mb}",
        "--save", "${REDIS_SAVE_SECONDS:-60}", "1",
        "--save", "300", "10",
        "--dir", "/data"
      ]

  redis-commander:
    container_name: supabase-redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: unless-stopped
    ports:
      - ${REDIS_COMMANDER_PORT:-8081}:8081
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=${REDIS_DASHBOARD_USER:-redis}
      - HTTP_PASSWORD=${REDIS_DASHBOARD_PASSWORD:-redis}
    depends_on:
      redis:
        condition: service_healthy
