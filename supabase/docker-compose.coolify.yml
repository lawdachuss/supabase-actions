# =============================================================================
# 🐳 Coolify — self-hosted PaaS for deploying your frontends
# =============================================================================
# Adds a full Coolify stack (app + its own Postgres / Redis / Realtime) on the
# SAME Docker network as Supabase. Coolify's UI is published on host port 8082
# (8080 inside the container) so it never clashes with Kong on :8000. Host ports
# 80/443 are also published (Coolify's internal Traefik proxy) so frontends
# deployed via Coolify are reachable at *.apps.<domain> -> localhost:80.
#
# The stack must be able to see the running Supabase compose set (base + logs +
# redis) so `utils/setup-coolify.sh` passes all four files — that keeps the
# config identical for already-running services (no mid-session recreation).
#
# Usage:
#   bash utils/setup-coolify.sh        # one-shot: prep + up + health check
#   docker compose -f docker-compose.yml -f docker-compose.logs.yml \
#     -f docker-compose.redis.yml -f docker-compose.coolify.yml up -d
#
# Config (all optional, sane defaults):
#   COOLIFY_VERSION            Coolify image tag            (default: latest)
#   COOLIFY_REALTIME_VERSION   Realtime image tag           (default: 1.0.19)
#   COOLIFY_REGISTRY           Image registry               (default: docker.io)
#   COOLIFY_PORT               Host port for the UI         (default: 8082)
#   COOLIFY_SOKETI_PORT        Realtime public port         (default: 6001)
#   COOLIFY_SOKETI_REALTIME_PORT  Realtime websocket port   (default: 6002)
#   + COOLIFY_DB_PASSWORD / COOLIFY_REDIS_PASSWORD / COOLIFY_PUSHER_* ...
#
# Runtime secrets live in added volumes (never committed):
#   - volumes/coolify/source/.env  -> the Laravel env, mounted read-only
#   - COOLIFY_* vars in .env       -> used for compose interpolation here
# Both are generated by utils/setup-coolify.sh.
# =============================================================================

services:

  coolify:
    image: "${COOLIFY_REGISTRY:-docker.io}/coollabsio/coolify:${COOLIFY_VERSION:-latest}"
    container_name: coolify
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ./volumes/coolify/source/.env
    environment:
      APP_ENV: production
      PHP_MEMORY_LIMIT: "${COOLIFY_PHP_MEMORY_LIMIT:-256M}"
      PHP_FPM_PM_CONTROL: dynamic
      PHP_FPM_PM_START_SERVERS: 1
      PHP_FPM_PM_MIN_SPARE_SERVERS: 1
      PHP_FPM_PM_MAX_SPARE_SERVERS: 10
    ports:
      - "${COOLIFY_PORT:-8082}:8080"
      # Coolify's internal Traefik proxy — deployed frontends are served here.
      # Route *.apps.<your-domain> -> localhost:80 through your CF Zero-Trust tunnel.
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket -> lets Coolify manage the host daemon (deploy apps/proxy)
      - /var/run/docker.sock:/var/run/docker.sock
      # App config (generated by utils/setup-coolify.sh)
      - ./volumes/coolify/source/.env:/var/www/html/.env:ro
      # Coolify state (SSH keys, project/app configs, backups)
      - ./volumes/coolify/ssh:/var/www/html/storage/app/ssh
      - ./volumes/coolify/applications:/var/www/html/storage/app/applications
      - ./volumes/coolify/databases:/var/www/html/storage/app/databases
      - ./volumes/coolify/services:/var/www/html/storage/app/services
      - ./volumes/coolify/backups:/var/www/html/storage/app/backups
      - ./volumes/coolify/images:/var/www/html/storage/app/images
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
    depends_on:
      coolify-postgres:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
      coolify-realtime:
        condition: service_healthy

  coolify-postgres:
    image: postgres:15-alpine
    container_name: coolify-db
    restart: unless-stopped
    volumes:
      - coolify-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${COOLIFY_DB_USERNAME:-coolify}
      POSTGRES_PASSWORD: ${COOLIFY_DB_PASSWORD:-coolify}
      POSTGRES_DB: ${COOLIFY_DB_NAME:-coolify}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COOLIFY_DB_USERNAME:-coolify} -d ${COOLIFY_DB_NAME:-coolify}"]
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-redis:
    image: redis:7-alpine
    container_name: coolify-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "20 1"
      - --loglevel
      - warning
      - --requirepass
      - ${COOLIFY_REDIS_PASSWORD:-coolify}
    environment:
      REDIS_PASSWORD: ${COOLIFY_REDIS_PASSWORD:-coolify}
    volumes:
      - coolify-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${COOLIFY_REDIS_PASSWORD:-coolify}' ping | grep -q PONG"]
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-realtime:
    image: "${COOLIFY_REGISTRY:-docker.io}/coollabsio/coolify-realtime:${COOLIFY_REALTIME_VERSION:-1.0.19}"
    container_name: coolify-realtime
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${COOLIFY_SOKETI_PORT:-6001}:6001"
      - "${COOLIFY_SOKETI_REALTIME_PORT:-6002}:6002"
    volumes:
      - ./volumes/coolify/ssh:/var/www/html/storage/app/ssh
    environment:
      APP_NAME: "${COOLIFY_APP_NAME:-Coolify}"
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: ${COOLIFY_PUSHER_APP_ID:-coolify}
      SOKETI_DEFAULT_APP_KEY: ${COOLIFY_PUSHER_APP_KEY:-coolify}
      SOKETI_DEFAULT_APP_SECRET: ${COOLIFY_PUSHER_APP_SECRET:-coolify}
      SOKETI_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

volumes:
  coolify-db:
  coolify-redis: