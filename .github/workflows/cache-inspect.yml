name: cache-inspect

on:
  workflow_dispatch:

env:
  BACKUP_FILE: ./supabase/supabase-state.tar.gz

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore state cache
        id: cache-db
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BACKUP_FILE }}
          key: supabase-db-live-999999999
          restore-keys: |
            supabase-db-live-
            supabase-db-

      - name: Inspect archive
        run: |
          echo "cache hit: ${{ steps.cache-db.outputs.cache-hit }}"
          if [ -f ./supabase/supabase-state.tar.gz ]; then
            echo "archive present: $(du -h ./supabase/supabase-state.tar.gz | cut -f1)"
            echo "=== coolify/dump entries in tar ==="
            tar tzvf ./supabase/supabase-state.tar.gz 2>/dev/null | grep -iE 'coolify|dump' || echo "(none) coolify/dump matching entries"
            echo "=== full tar listing (top 80) ==="
            tar tzf ./supabase/supabase-state.tar.gz 2>/dev/null | head -80
          else
            echo "archive MISSING from cache restore"
            ls -la ./supabase/ | head -30
          fi

      - name: Upload state archive for offline inspection
        uses: actions/upload-artifact@v4
        with:
          name: state-archive
          path: ./supabase/supabase-state.tar.gz
          retention-days: 3
          if-no-files-found: ignore